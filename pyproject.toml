[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-simplepapi"
version = "0.1.0"
description = "A lightweight and extensible PlaceholderAPI for Endstone."
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11,<0.12",
]

[project.entry-points."endstone"]
simplepapi = "simplepapi:SimplePAPIPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/simplepapi"]